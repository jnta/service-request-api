spring:
  application:
    name: service-request-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solicitations}
    username: ${DB_USERNAME:solicitations}
    password: ${DB_PASSWORD:solicitations}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: solicitation-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:service-request-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_ADMIN_NAME:Local Administrator}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

integration:
  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br/ws}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Service Request API

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.jnta: INFO
